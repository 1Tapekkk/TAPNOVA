services:
  licenses:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: https://${LICENSE_DOMAIN:?Set LICENSE_DOMAIN in .env}
    volumes:
      - license_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      LICENSE_DOMAIN: ${LICENSE_DOMAIN:?Set LICENSE_DOMAIN in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      licenses:
        condition: service_healthy
volumes:
  license_data:
  caddy_data:
  caddy_config:
